<section class="cw-panel" aria-labelledby="ID"><div class="cw-panel-head"><h2 id="ID">Sanction Mallory</h2></div><div class="cw-panel-body"><form class="cw-form cw-panel-pad" novalidate=""><div class="cw-form-body"><div class="cw-action-grid"><div class="cw-field"><label for="ID-what">What happens</label><select id="ID-what"><option value="">Choose</option><option value="warning">Warning</option><option value="chat">Chat restriction</option><option value="area">Area restriction</option><option value="ban">Ban</option></select></div><div class="cw-field"><label for="ID-rule">Community Rule</label><select id="ID-rule"><option value="">Choose a rule</option><option value="1">Rule 1: No slurs or hate aimed at who someone is</option><option value="2">Rule 2: No insulting, threatening or targeting another player</option><option value="3">Rule 3: No sexual messages</option><option value="4">Rule 4: No spam, flooding or advertising</option><option value="5">Rule 5: No cheating or exploiting</option><option value="6">Rule 6: No throwing, stalling or ruining games on purpose</option><option value="7">Rule 7: No offensive names</option><option value="8">Rule 8: No false reports</option><option value="uncovered">No rule covers this</option></select></div></div><div class="cw-field"><label for="ID-reason">Reason</label><p id="ID-reason-hint" class="cw-hint">Only staff see this. The player does not.</p><textarea id="ID-reason" aria-describedby="ID-reason-hint ID-reason-counter" rows="3"></textarea><p id="ID-reason-counter" class="cw-counter">0 of 500</p></div><p class="cw-hint">The player is not sent a notice about this. A decision on a report is what tells them.</p><div class="cw-action-foot"><button type="submit" class="cw-btn cw-btn--primary" aria-disabled="false" aria-busy="false">Apply</button><button type="button" class="cw-btn">Cancel</button></div></div></form></div></section>
