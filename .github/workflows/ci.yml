name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # check:pack builds every package; scripts/browser-bundle.test.ts (run by npm test below) bundles that dist for a browser.
      - run: npm run check:pack
      - run: npm run lint
      - run: npm test

  # The landing page (site/) is not part of the packages: it has its own tests (copy, built-page scans, CSP, axe) and build.
  # Kept apart so a site change never blocks the package matrix and a package change never waits on a browser download.
  site:
    name: Site (test and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The CSP and accessibility tests drive a real browser. The browser download is cached per Playwright version; the
      # system packages (apt) are not part of the cache, so they are installed on a hit as well.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # System packages are best-effort: the runner image already has Chromium's libraries, and an apt mirror outage
      # (2026-11-11) must not fail CI. A library that is really missing still fails the browser tests (CW_REQUIRE_BROWSER).
      - run: npx playwright install-deps chromium || echo "::warning::playwright install-deps failed; using the runner image's libraries"
      - run: npm run test --workspace site
      - run: npm run build --workspace site
      # The build re-renders the OG image and icons. If they differ from the committed PNGs, fail: re-render locally
      # (`npm run og --workspace site`) and commit them.
      - run: git diff --exit-code -- site/public/*.png

  # The hub element's browser smoke: a real Chromium loads the built script on a bare page. It is the only guard for what jsdom cannot
  # compute (custom-property inheritance through a shadow root, real focus and keys, the CSP). Kept apart, like site, so a package
  # change never waits on a browser download. CW_REQUIRE_BROWSER makes a missing browser a failure, not a skip.
  element-browser:
    name: Hub element (Chromium smoke)
    runs-on: ubuntu-latest
    env:
      CW_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browser download is cached per Playwright version; the system packages (apt) are not part of the cache, so they are
      # installed on a hit as well.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # System packages are best-effort: the runner image already has Chromium's libraries, and an apt mirror outage
      # (2026-11-11) must not fail CI. A library that is really missing still fails the browser tests (CW_REQUIRE_BROWSER).
      - run: npx playwright install-deps chromium || echo "::warning::playwright install-deps failed; using the runner image's libraries"
      - run: npm run smoke:browser --workspace @chatwarden/hub-element

  smoke:
    name: Smoke (consumer install) Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Packs every package (prepack runs), installs the tarballs into fresh ESM and CommonJS projects, typechecks and runs them.
      - run: node scripts/smoke.mjs
      # Convenience copy of the tarballs (one leg is enough: they are identical). The smoke run above is the gate; the
      # upload is best-effort so an account-wide artifact quota can never turn CI red. Adopters vendoring before the
      # first npm publish can also run `node scripts/smoke.mjs` locally and take `.smoke/tarballs/`.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && matrix.node == '24' }}
        continue-on-error: true
        with:
          name: chatwarden-tarballs
          path: .smoke/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7
