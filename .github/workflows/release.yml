name: Release

# Publishes the seven @chatwarden packages to npm, in dependency order, with provenance.
#   - Run it by hand (Actions tab -> Release -> Run workflow) for a dry run: everything except the upload. dry_run defaults to true.
#   - A real publish runs on a tag only: push a tag v<version> (for example v0.1.0). A tag push is never a dry run.
#   - Provenance needs a PUBLIC source repository. The owner makes hainix/chatwarden public first (see RELEASING.md); until
#     then a real publish stops with a clear message. The provenance input (default true) lets a manual run deliberately
#     publish without provenance; a tag push always uses it.
# The steps and the one-time setup are in RELEASING.md. Auth: the NPM_TOKEN secret when it is set (needed for the very first
# publish), otherwise npm trusted publishing (OIDC) once each package lists this repository and workflow on npmjs.com.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, check, smoke-test and a dry-run publish, but upload nothing'
        type: boolean
        default: true
      provenance:
        description: 'Publish with provenance (needs a public repository). Untick only to publish deliberately without it'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'dry run' || 'publish' }})
    runs-on: ubuntu-latest
    env:
      # A tag push is always a real publish; a manual run follows the dry_run input.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      # A tag push always has provenance (the first operand is true); a manual run follows the provenance input.
      PROVENANCE: ${{ github.event_name != 'workflow_dispatch' || inputs.provenance }}
    steps:
      - name: Real publishes run on a tag
        if: ${{ env.DRY_RUN != 'true' && github.ref_type != 'tag' }}
        run: |
          echo "::error::A real publish must run on a version tag (v0.1.0, ...), but this run is on ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}. Push the tag, or run this workflow again with Dry run ticked."
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:pack
      - name: Smoke test (pack, install and run in fresh ESM and CommonJS projects)
        run: node scripts/smoke.mjs

      - name: Check the tag matches the package version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version v$version. Delete the tag, fix the version, and tag again."
            exit 1
          fi

      - name: Check the repository is public (npm provenance needs it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          private="$(gh api repos/${{ github.repository }} -q .private)"
          if [ "$private" != "true" ]; then
            echo "repository is public"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::warning::${GITHUB_REPOSITORY} is private. A dry run skips provenance, but a real publish with provenance will fail until the owner makes hainix/chatwarden public (see RELEASING.md, one-time setup)."
          elif [ "$PROVENANCE" = "true" ]; then
            echo "::error::${GITHUB_REPOSITORY} is private, and npm provenance refuses a private source repository, so nothing can be published. The owner has to make hainix/chatwarden public first (see RELEASING.md, one-time setup). To publish without provenance on purpose, run this workflow by hand from a tag with the provenance box unticked."
            exit 1
          else
            echo "::warning::${GITHUB_REPOSITORY} is private and provenance is off, so this publish carries no provenance statement."
          fi

      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 24 may ship an older npm.
      - name: Use an npm with trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Choose npm auth for a real publish
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "publishing with the NPM_TOKEN secret"
          else
            echo "::notice::No NPM_TOKEN secret: publishing through npm trusted publishing (OIDC). Each package must list hainix/chatwarden and release.yml as its trusted publisher on npmjs.com; a package without it fails with an auth error. The first publish of a new package needs NPM_TOKEN (see RELEASING.md)."
          fi

      - name: Publish in dependency order (dry run unless this is a tag push or dry_run is off)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Scripts are not disabled: prepack runs (tsc -b), exactly as for a real publish.
          flags=(--access public)
          if [ "$PROVENANCE" = "true" ]; then flags+=(--provenance); fi
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          # An assignment (unlike the list of a for loop) passes a failure of publish-order.mjs on to set -e.
          specs="$(node scripts/publish-order.mjs)"
          if [ -z "$specs" ]; then
            echo "::error::scripts/publish-order.mjs printed no packages, so there is nothing to publish."
            exit 1
          fi
          for spec in $specs; do
            name="${spec%@*}"
            version="${spec##*@}"
            # Skip a version that is already on npm, so a re-run after a partial publish is safe.
            existing="$(npm view "$spec" version 2>/dev/null || true)"
            if [ "$existing" = "$version" ]; then
              echo "skip $spec: already on npm"
              continue
            fi
            echo "publish $spec (dry run: $DRY_RUN, provenance: $PROVENANCE)"
            npm publish --workspace "$name" "${flags[@]}"
          done
