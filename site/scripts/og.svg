<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="ga" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 40) scale(620)">
      <stop offset="0" stop-color="#ff3d8f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff3d8f" stop-opacity="0"/>
