    <noscript>
      <p class="noscript">
        Chatwarden is free, open-source chat moderation for games. It blocks slurs from your word list before they're posted,
        lets players report a message right from the chat, and gives your team a moderator hub where each player with open
        reports is a case, handled in one click. It runs on your own Node server. The live demo needs JavaScript. Read the code on
        <a href="https://github.com/hainix/chatwarden">GitHub</a> or install it from
        <a href="https://www.npmjs.com/package/@chatwarden/core">npm</a>.
