<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatwarden: free chat moderation for games</title>
    <meta
      name="description"
      content="Chatwarden is a free, open-source chat moderation kit for games. It refuses slurs that dodge filters, keeps evidence for reports and gives players a fair ladder."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e1a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/bungee-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        var t = localStorage.getItem('cw-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
